[package]
name = "narrow-gate"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.52.1", features = ["full"] }
axum = {version = "0.8.9", features = ["macros","http2", "ws"]}
bytes = "1.11.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
hyper = {version = "1.9.0", features = ["full"]}